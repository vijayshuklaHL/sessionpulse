<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Session Pulse animated terminal session status illustration">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10151c"/><stop offset="1" stop-color="#090c12"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#27313e" stroke-opacity=".32" stroke-width="1"/></pattern>
  <filter id="shadow" x="-25%" y="-35%" width="150%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000" flood-opacity=".42"/></filter>
  <clipPath id="screenclip"><rect x="178" y="166" width="844" height="395" rx="18"/></clipPath>
 </defs>
 <style>
 @keyframes trace { 0% {stroke-dashoffset:560;opacity:.25} 12%{opacity:1} 59%{stroke-dashoffset:0;opacity:1} 82%,100%{stroke-dashoffset:0;opacity:.9} }
 @keyframes breathe {0%,100%{opacity:.6;transform:scale(.92)} 45%{opacity:1;transform:scale(1.14)}}
 @keyframes aura {0%,100%{opacity:.08;transform:scale(.9)} 45%{opacity:.26;transform:scale(1.17)}}
 @keyframes cursor {0%,64%,100%{opacity:.95} 75%{opacity:.28}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important}}
 .trace{stroke-dasharray:560;stroke-dashoffset:560;animation:trace 2.2s ease-in-out infinite}
 .breath{transform-box:fill-box;transform-origin:center;animation:breathe 2.2s ease-in-out infinite}
 .aura{transform-box:fill-box;transform-origin:center;animation:aura 2.2s ease-in-out infinite}
 .cursor{animation:cursor 2.2s ease-in-out infinite}
 </style>
 <rect width="1200" height="720" fill="url(#bg)"/>
 <rect width="1200" height="720" fill="url(#grid)" opacity=".7"/>
 <circle cx="1030" cy="118" r="220" fill="#5cc27a" opacity=".025"/>
 <text x="144" y="89" fill="#f1f3f6" font-family="Inter, DejaVu Sans, sans-serif" font-weight="650" font-size="27" letter-spacing="-.8">Session Pulse</text>
 <text x="146" y="121" fill="#83909f" font-family="Inter, DejaVu Sans, sans-serif" font-size="14">A quiet instrument panel for your coding sessions</text>
 <g filter="url(#shadow)">
 <rect x="144" y="158" width="912" height="420" rx="26" fill="#131b25" stroke="#33404e" stroke-width="2"/>
 <rect x="160" y="175" width="880" height="386" rx="19" fill="#0c1219"/>
 </g>
 <path d="M160 231H1040" stroke="#2a3440" stroke-width="2"/>
 <circle cx="190" cy="203" r="5" fill="#536170"/><circle cx="209" cy="203" r="5" fill="#536170"/><circle cx="228" cy="203" r="5" fill="#536170"/>
 <text x="600" y="209" fill="#90a0b2" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">session-pulse — local monitor</text>
 <g transform="translate(912,203)"><circle cx="0" cy="0" r="18" fill="#5cc27a" class="aura"/><circle cx="0" cy="0" r="8.16" fill="#5cc27a" class="breath"/></g>
 <g clip-path="url(#screenclip)">
 <text x="208" y="282" fill="#8293a5" font-family="DejaVu Sans Mono, monospace" font-size="15">$ session-pulse --watch</text>
 <text x="210" y="350" fill="#eef0f2" font-family="DejaVu Sans Mono, monospace" font-size="63" font-weight="700">&gt;</text>
 <path d="M 424 336 L 483 336 L 504 320 L 529 356 L 555 293 L 582 374 L 608 330 L 631 336 L 768 336" fill="none" stroke="#5cc27a" stroke-width="5.8" stroke-linejoin="round" stroke-linecap="round" opacity=".13"/>
 <path d="M 424 336 L 483 336 L 504 320 L 529 356 L 555 293 L 582 374 L 608 330 L 631 336 L 768 336" fill="none" stroke="#5cc27a" stroke-width="5.8" stroke-linejoin="round" stroke-linecap="round" class="trace"/>
 <rect x="779" y="334" width="26" height="5" rx="2.5" fill="#eff1f3" class="cursor"/>
 <text x="209" y="441" fill="#eef0f2" font-family="Inter, DejaVu Sans, sans-serif" font-size="33" font-weight="600">Idle</text>
 <text x="210" y="478" fill="#8695a5" font-family="Inter, DejaVu Sans, sans-serif" font-size="17">All open sessions are idle</text>
 <path d="M209 511H988" stroke="#25303b" stroke-width="1"/>
 <text x="210" y="538" fill="#758597" font-family="DejaVu Sans Mono, monospace" font-size="12">LOCAL ONLY</text>
 <circle cx="370" cy="534" r="3" fill="#5cc27a"/><text x="382" y="538" fill="#758597" font-family="DejaVu Sans Mono, monospace" font-size="12">PRIVATE BY DEFAULT</text>
 </g>
 <g>
 <rect x="144" y="602" width="290" height="64" rx="14" fill="#151e28" stroke="#293542"/>
 <circle cx="172" cy="634" r="5.5" fill="#f0a24a"/><text x="191" y="631" fill="#aab5c3" font-family="Inter, DejaVu Sans, sans-serif" font-size="13">Working</text><text x="191" y="649" fill="#617184" font-family="Inter, DejaVu Sans, sans-serif" font-size="11">pulse in motion</text>
 <rect x="454" y="602" width="290" height="64" rx="14" fill="#151e28" stroke="#293542"/>
 <circle cx="482" cy="634" r="5.5" fill="#5cc27a"/><text x="501" y="631" fill="#aab5c3" font-family="Inter, DejaVu Sans, sans-serif" font-size="13">Idle</text><text x="501" y="649" fill="#617184" font-family="Inter, DejaVu Sans, sans-serif" font-size="11">a slower breath</text>
 <rect x="764" y="602" width="292" height="64" rx="14" fill="#151e28" stroke="#293542"/>
 <circle cx="792" cy="634" r="5.5" fill="#77818e"/><text x="811" y="631" fill="#aab5c3" font-family="Inter, DejaVu Sans, sans-serif" font-size="13">No sessions</text><text x="811" y="649" fill="#617184" font-family="Inter, DejaVu Sans, sans-serif" font-size="11">quiet until needed</text>
 </g>
 </svg>